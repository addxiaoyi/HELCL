name: Native credential and identity verification

on:
  workflow_dispatch:
  push:
    branches: ['codex/remote-followup-ci-*']
    paths:
      - 'src/HelL.Core/**'
      - 'src/HelL/Core/**'
      - 'src/HelL.Remote/RemotePairingStore.cs'
      - 'src/HelL.Remote/DeviceTunnel.cs'
      - 'tools/HelL.Credentials.Verify/**'
      - 'tools/run_native_credentials.sh'
      - '.github/workflows/native-credentials.yml'
  pull_request:
    paths:
      - 'src/HelL.Core/Portable/AccountVault.cs'
      - 'src/HelL.Core/Portable/SystemSecretStore.cs'
      - 'src/HelL/Core/Launcher/AccountManager.cs'
      - 'src/HelL/Core/Launcher/Auth.cs'
      - 'src/HelL.Remote/RemotePairingStore.cs'
      - 'tools/HelL.Credentials.Verify/**'
      - 'tools/run_native_credentials.sh'
      - '.github/workflows/native-credentials.yml'

permissions:
  contents: read

jobs:
  native-credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install native Linux credential dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-tools gnome-keyring dbus-x11
      - name: Verify native secrets, failed saves and identity recovery
        shell: bash
        run: bash tools/run_native_credentials.sh "$GITHUB_WORKSPACE/artifacts/native-credentials-report.json" "$RUNNER_TEMP/hell-native-credentials-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-credentials-${{ runner.os }}
          path: artifacts/native-credentials-report.json
          if-no-files-found: error
