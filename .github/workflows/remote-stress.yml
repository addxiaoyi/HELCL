name: Remote lifecycle stress acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: ['codex/remote-followup-ci-20261118-02']
    paths:
      - 'src/HelL.Remote/**'
      - 'src/HelL.Relay/**'
      - 'tests/HelL.Remote.Tests/**'
      - 'tests/HelL.Remote.Stress.Tests/**'
      - 'tools/HelL.Remote.Stress/**'
      - '.github/workflows/remote-stress.yml'
  push:
    branches: ['codex/backend-followup-ci-*']
    paths:
      - 'src/HelL.Remote/**'
      - 'src/HelL.Relay/**'
      - 'src/HelL.Contracts/**'
      - 'src/HelL.Companion/**'
      - 'src/HelL.Core/**'
      - 'src/HelL/Core/**'
      - 'src/HelL.Mobile/**'
      - 'src/HelL.Design/**'
      - 'src/HelL/Resources/**'
      - 'tests/HelL.Remote.Tests/**'
      - 'tests/HelL.Portable.Tests/**'
      - 'tests/HelL.Tests/*.cs'
      - 'tests/HelL.Remote.Stress.Tests/**'
      - 'tools/HelL.Credentials.Verify/**'
      - 'tools/HelL.Remote.Stress/**'
      - 'tools/HelL.Companion.Host/**'
      - 'tools/HelL.Mobile.Preview/**'
      - 'tools/run_native_credentials.sh'
      - 'deploy/relay/**'
      - 'docs/licenses/**'
      - '.github/workflows/remote-stress.yml'

permissions:
  contents: read

jobs:
  loopback-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Run stress configuration and cleanup safeguards
        run: dotnet test tests/HelL.Remote.Stress.Tests/HelL.Remote.Stress.Tests.csproj -c Release --artifacts-path "$RUNNER_TEMP/remote-stress-tests" --nologo -v minimal
      - name: Run remote transport and relay regressions
        run: dotnet test tests/HelL.Remote.Tests/HelL.Remote.Tests.csproj -c Release --artifacts-path "$RUNNER_TEMP/remote-regressions" --logger 'trx;LogFileName=remote.trx' --results-directory artifacts/remote-stress --nologo -v minimal
      - name: Exercise three full remote lifecycle cycles with two paired clients
        run: dotnet run --project tools/HelL.Remote.Stress/HelL.Remote.Stress.csproj -c Release -- --cycles 3 --pairs 2 --seed 20261118 --report artifacts/remote-stress/report.json
      - name: Verify stress report represents completed fixture cleanup
        shell: pwsh
        run: |
          $report = Get-Content -Raw artifacts/remote-stress/report.json | ConvertFrom-Json
          if ($report.Status -ne 'passed' -or $report.CompletedCycles -ne 3 -or $report.RelayRestarts -ne 3 -or -not $report.HostSessionsStopped -or -not $report.RelayStopped -or -not $report.OwnedWorkspaceRemoved -or $report.FinalSecretEntries -ne 0 -or $report.FinalFixtureTasks -ne 0 -or $report.Errors.Count -ne 0) { throw 'The bounded stress receipt is incomplete or reports leaked state.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/remote-stress
          if-no-files-found: warn
